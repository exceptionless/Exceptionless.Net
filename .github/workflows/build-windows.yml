name: Build Windows
on: [push, pull_request]
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
permissions:
  contents: read
  packages: write
jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Build Reason
      run: "echo ref: ${{github.ref}} event: ${{github.event_name}}"
    - name: Build Version
      shell: bash
      run: |
        dotnet tool install --global minver-cli --version 8.0.0
        version=$(minver --tag-prefix v)
        echo "MINVERVERSIONOVERRIDE=$version" >> $GITHUB_ENV
        echo "PACKAGE_SMOKE_VERSION=0.0.0-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" >> $GITHUB_ENV
    - name: Build
      run: dotnet build --configuration Release Exceptionless.Net.Windows.slnx
    - name: Run Tests
      run: dotnet test --configuration Release --no-build Exceptionless.Net.Windows.slnx
    - name: Pack Core for .NET Framework Test
      run: dotnet pack --configuration Release --no-build --output "$env:RUNNER_TEMP/exceptionless-package-smoke" -p:SolutionDir="${{ github.workspace }}/" -p:MinVerVersionOverride="$env:PACKAGE_SMOKE_VERSION" src/Exceptionless/Exceptionless.csproj
    - name: .NET Framework Package Consumer Smoke Test
      run: dotnet run --configuration Release --framework net472 -p:ExceptionlessPackageVersion="$env:PACKAGE_SMOKE_VERSION" -p:ExceptionlessPackageSource="$env:RUNNER_TEMP/exceptionless-package-smoke" --project test/Exceptionless.PackageConsumerSmoke/Exceptionless.PackageConsumerSmoke.csproj
    - name: Package
      if: github.event_name != 'pull_request'
      run: dotnet pack --configuration Release --no-build Exceptionless.Net.Windows.slnx
    - name: Install GitHub Package Tool
      if: github.event_name != 'pull_request'
      run: dotnet tool install gpr -g
    - name: Publish CI Packages
      shell: bash
      if: github.event_name != 'pull_request'
      run: |
        for package in $(find -name "*.nupkg" | grep "minver" -v); do
          echo "${0##*/}": Pushing $package...

          # GitHub
          gpr push $package -k ${{ secrets.GITHUB_TOKEN }} || true

          # Feedz (remove once GitHub supports anonymous access)
          dotnet nuget push $package --source https://f.feedz.io/exceptionless/exceptionless/nuget --api-key ${{ secrets.FEEDZ_KEY }} --skip-duplicate
        done
    - name: Publish Release Packages
      shell: bash
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        for package in $(find -name "*.nupkg" | grep "minver" -v); do
          echo "${0##*/}": Pushing $package...
          dotnet nuget push $package --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_KEY }} --skip-duplicate
        done
